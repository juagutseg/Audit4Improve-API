name: juagutseg-Automation
on:
  issues:
    types: [opened]
  project_card:
    types: [moved]
  workflow_dispatch: 

jobs:
  gestion-proyectos:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Bienvenida a nuevos Issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '¡Hola @' + context.actor + '! Gracias por abrir este Issue en el proyecto de juagutseg. Un administrador lo revisará pronto.'
            })

      - name: Log de movimiento o ejecución manual
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'project_card'
        run: |
          echo "Acción ejecutada por el usuario: ${{ github.actor }}"
          echo "Evento disparador: ${{ github.event_name }}"